spring.application.name=Paint
server.address=0.0.0.0
server.port=443

server.ssl.key-store=${SSL_KEY_PATH}
server.ssl.key-store-password=${SSL_KEY_PASSWORD}
server.ssl.keyStoreType=${SSL_KEY_TYPE}
server.ssl.keyAlias=${SSL_KEY_ALIAS}

# JWT configuration
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=${JWT_EXP_TIME}

#sql stuff
spring.sql.init.mode=always
