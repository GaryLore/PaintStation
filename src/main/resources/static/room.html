<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Room</title>
    <link rel="stylesheet" href="/css/room.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script type="module" src="/javascript/roomPage/main.js"></script>

</head>
<body>
    <div class="layout">

        <div class="header">
            <div class="left"></div>
            <h1 class="title">🎨 Paint Station</h1>
            <div class="icons">
                <button class="icon trash">
                    <img src="/img/trash-2.svg" alt="trash" >
                </button>
                <button class="icon homePage">
                    <img src="/img/house.svg" alt="homePage">
                </button>
                <button class="icon save">
                    <img src="/img/save.svg" alt="homePage">
                </button>
            </div>
        </div>

        <div class="middleContainer">
            <div class="paintContainer">
                <canvas id="canvas" class="optionBrush">Paint Canvas</canvas>
                <div class="options">

                    <div class="colorSelection separation">
                        <div class="choices">
                        </div>
                        <div id="all_colors" class="colors">
                        </div>
                    </div>

                    <div class="thickness separation">
                        <label for="all_thickness">Paint Thickness</label>
                        <input type="range" name="thickness" id="all_thickness" min="4" max="50" value="10">
                    </div>

                    <div class="paintTools seperation">
                        <div class="tool zoom">
                             <img src="/img/magnify.png" alt="Zoom" >
                        </div>
                        <div class="tool brush selected">
                             <img src="/img/paint.png" alt="PaintBrush" >
                        </div>
                        <div class="tool bucket">
                             <img src="/img/bucket.png" alt="Bucket" >
                        </div>
                    </div>

                </div>
            </div>
            <div class="chat">

                <div class="chatHeader">
                    <h2>Players Chat</h2>
                    <div class="onlineStatus">
                        <p class="onlineDot"></p>
                        <p class="subtitle" id="userCount"> Online</p>
                    </div>
                </div>
                <div class="players">

                </div>
                <div class="messagesContainer">

                </div>
                <form class="createMessage" id="chatForm">
                    <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off" aria-label="messageInput">
                    <button id="sendMessage">Send</button>
                </form>
            </div>

        </div>
    </div>

</body>
</html>
