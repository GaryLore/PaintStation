<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Room</title>
    <link rel="stylesheet" href="/css/room.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script type="module" src="/javascript/roomPage/main.js"></script>

</head>
<body>
    <div class="app-layout">

        <div class="header">
            <div class="header__left"></div>
            <h1 class="header__title">🎨 Paint Station</h1>
            <div class="header__icons">
                <button class="header__icon-btn header__icon-btn--trash" aria-label="Delete drawing">
                    <img src="/img/trash-2.svg" alt="">
                </button>
                <button class="header__icon-btn header__icon-btn--homepage" aria-label="Go to home page">
                    <img src="/img/house.svg" alt="">
                </button>
                <button class="header__icon-btn header__icon-btn--save" aria-label="Save drawing">
                    <img src="/img/save.svg" alt="">
                </button>
            </div>
        </div>

        <div class="app-layout__middle">
            <div class="paint">
                <canvas id="canvas" class="paint__canvas paint__canvas--brush">Paint Canvas</canvas>
                <div class="paint__toolbar">

                    <div class="paint__color-picker">
                        <div class="paint__color-choices">
                        </div>
                        <div id="all_colors" class="paint__palette">
                        </div>
                    </div>

                    <div class="paint__thickness">
                        <label for="all_thickness">Paint Thickness</label>
                        <input type="range" class="paint__thickness-input" name="thickness" id="all_thickness" min="4" max="50" value="10">
                    </div>

                    <div class="paint__tools">
                        <button class="paint__tool"
                                data-tool="pan-zoom"
                                aria-label="Brush tool">
                                <img class="paint__tools-img" src="/img/magnify.png" alt="">
                        </button>
                        <button class="paint__tool paint__tool--selected"
                                data-tool="brush"
                                aria-label="Bucket fill tool">
                                <img class="paint__tools-img" src="/img/paint.png" alt="">
                        </button>
                        <button class="paint__tool"
                                data-tool="bucket"
                                aria-label="Pan and zoom tool">
                                <img class="paint__tools-img" src="/img/bucket.png" alt="Bucket" >
                        </button>
                    </div>

                </div>
            </div>
            <div class="chat">

                <div class="chat__header">
                    <h2>Players Chat</h2>
                    <div class="chat__status">
                        <p class="chat__status-dot"></p>
                        <p class="subtitle" id="userCount"> Online</p>
                    </div>
                </div>
                <div class="chat__players">

                </div>
                <div class="chat__messages">

                </div>
                <form class="chat__form" id="chatForm">
                    <input type="text" class="chat__input" id="messageInput" placeholder="Type your message..." autocomplete="off" aria-label="messageInput">
                    <button class="chat__send-btn" id="sendMessage">Send</button>
                </form>
            </div>

        </div>
    </div>

</body>
</html>
