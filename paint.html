<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint</title>
    <link rel="stylesheet" href="style.css">
    <script src="dot.js" ></script>
    <script src="stroke.js" ></script>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Paint Station</h1>
    <canvas id="canvas">Paint Canvas</canvas>

    <div class="options">
        <div id="all_colors" class="colors">

        </div>
        <div class="thickness">
            <p>Paint Thickness</p>
            <input type="range" name="thickness" id="all_thickness" min="1" max="50">
        </div>
        <div class="zoom">
             <img src="img/magnify.png" alt="Zoom" > 
        </div>
        <div class="bucket">
             <img src="img/bucket.png" alt="Bucket" > 
        </div>
        <div class="brush">
             <img src="img/paint.png" alt="PaintBrush" > 
        </div>
    </div>
</body>
</html>
